name: iOS-watchOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'
      
      - name: Build iOS
        run: |
          xcodebuild -project "Slient Gym.xcodeproj" \
            -scheme "Slient Gym" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            clean build | xcpretty || exit 0
      
      - name: Build watchOS
        run: |
          xcodebuild -project "Slient Gym.xcodeproj" \
            -scheme "Slient Gym Watch App" \
            -sdk watchsimulator \
            -configuration Debug \
            -destination 'platform=watchOS Simulator,name=Apple Watch Series 9 (45mm)' \
            clean build | xcpretty || exit 0
      
      - name: Check build artifacts
        run: |
          echo "Build completed successfully"

