name: iOS-watchOS Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'
      - name: Build iOS (Debug)
        run: |
          xcodebuild -project "Silent Gym.xcodeproj" \
            -scheme "Silent Gym" \
            -sdk iphonesimulator \
            -configuration Debug build | xcpretty
      - name: Build watchOS (Debug)
        run: |
          xcodebuild -project "Silent Gym.xcodeproj" \
            -scheme "Silent Gym Watch App" \
            -sdk watchsimulator \
            -configuration Debug build | xcpretty

